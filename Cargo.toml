[workspace]
members = ["src-tauri"]
resolver = "2"

[package]
name = "ramopt"
version = "0.3.3"
edition = "2024"
description = "Lightweight Windows RAM cleanup utility"
license = "MIT"
autobins = false

[lib]
name = "ramopt"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"], optional = true }

[features]
default = []
shared-backend = ["dep:windows-sys"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
