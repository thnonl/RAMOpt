[package]
name = "ramopt"
version = "0.2.4"
edition = "2024"
description = "Lightweight Windows RAM cleanup utility"
license = "MIT"
build = "build.rs"

[dependencies]
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["ico"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.15", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "raw-window-handle-06"] }
tray-icon = "0.21"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.15"
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
