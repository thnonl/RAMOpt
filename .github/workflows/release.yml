name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          if (git ls-remote --exit-code --tags origin "refs/tags/$tag") {
            Write-Host "Tag $tag already exists."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Build release package
        shell: pwsh
        run: .\package-release.ps1

      - name: Verify self-contained updater package
        shell: pwsh
        run: |
          $requiredFiles = 'RAMOpt.exe', 'RAMOpt-updater.bat'
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path '.\release\RAMOpt' $file))) {
              throw "Release package is missing $file"
            }
          }

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path .\release\RAMOpt\* -DestinationPath .\release\RAMOpt-Windows-x64.zip -Force

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAMOpt-Windows-x64
          path: .\release\RAMOpt-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: .\release\RAMOpt-Windows-x64.zip
